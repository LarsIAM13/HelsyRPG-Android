plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.helsyrpg.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.helsyrpg.app'
        minSdk 24
        targetSdk 35
        versionCode 520
        versionName '5.20'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython('python3.13')
    }
}

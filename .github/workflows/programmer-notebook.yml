name: Programmer Notebook APK

on:
  push:
    branches: ["build/programmer-notebook"]
    paths:
      - "programmer-notebook/**"
      - ".github/workflows/programmer-notebook.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and APK
        working-directory: programmer-notebook
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK package and signature
        working-directory: programmer-notebook
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          unzip -t "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | head -n 8
      - uses: actions/upload-artifact@v4
        with:
          name: ProgrammerNotebook-APK
          path: programmer-notebook/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
